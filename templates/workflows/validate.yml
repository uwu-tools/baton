# Check baton.yml on every pull request, before the rules take effect.
#
# Copy this file to .github/workflows/ in your <project>-baton repo,
# next to baton.yml, and keep BATON_VERSION in step with baton.yml's
# reconcile workflow. It needs no token: validate works offline.
name: validate

on:
  pull_request:

permissions: {}

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BATON_VERSION: v0.1.0

jobs:
  validate:
    name: Validate baton.yml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Validate baton.yml
        run: go run "github.com/uwu-tools/baton/cmd/baton@${BATON_VERSION}" validate baton.yml
